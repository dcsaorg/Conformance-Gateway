name: Sync Dependabot Alerts to Jira

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read
  security-events: read
  
jobs:
  sync-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Dependabot alerts
        id: alerts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/dependabot/alerts \
            > alerts.json

          cat alerts.json

      - name: Process alerts
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          HIGH_ALERTS=$(jq -c '.[] | select(.security_advisory.severity=="high" or .security_advisory.severity=="critical")' alerts.json)

          for alert in $HIGH_ALERTS; do
            CVE=$(echo $alert | jq -r '.security_advisory.cve_id')
            PACKAGE=$(echo $alert | jq -r '.dependency.package.name')
            SEVERITY=$(echo $alert | jq -r '.security_advisory.severity')
            URL=$(echo $alert | jq -r '.html_url')
            STATE=$(echo $alert | jq -r '.state')

            JQL="project = SD AND summary ~ \"$CVE\""
            RESPONSE=$(curl -s -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"jql\":\"$JQL\"}" \
              $JIRA_BASE_URL/rest/api/3/search)

            COUNT=$(echo $RESPONSE | jq '.total')

            if [ "$STATE" = "open" ] && [ "$COUNT" = "0" ]; then
              echo "Creating Jira ticket for $CVE"

              curl -s -X POST \
                -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data "{
                  \"fields\": {
                    \"project\": { \"key\": \"SD\" },
                    \"summary\": \"Dependabot: $CVE - $PACKAGE\",
                    \"description\": \"Severity: $SEVERITY\n\nPackage: $PACKAGE\n\nGitHub: $URL\",
                    \"issuetype\": { \"name\": \"Bug\" }
                  }
                }" \
                $JIRA_BASE_URL/rest/api/3/issue
            fi
          done