name: Deploy+Verify on AWS dev

on:
  push:
    branches: [ "dev" ]

env:
  AWS_REGION: "eu-north-1"
  NG_CLI_ANALYTICS: "ci"
  AWS_ENVIRONMENT: "dev"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print commit sha
        shell: bash
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "sha: $COMMIT_SHA"

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '25'
          cache: 'maven'

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Build Conformance-Gateway
        run: |
          ./mvnw package -B -V -DskipTests
      # No need to run tests, as they are already run in the PR workflow

      - name: Build Web UI
        run: |
          cd webui
          echo Install AWS CDK
          npm install -g aws-cdk
          echo Install dependencies
          npm install
          echo Build Web UI
          npm run build -- --configuration=${{ env.AWS_ENVIRONMENT }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}

      - name: Diff Conformance-Gateway Stack of ${{ env.AWS_ENVIRONMENT }}
        run: |
          cd cdk/
          cdk diff ${{ env.AWS_ENVIRONMENT }}ConformanceStack

      - name: Create pre-deployment reports in all sandboxes
        run: |
          echo "Creating report in all sandboxes before deployment..."
          REPORT_TITLE="Before DCSA deployment - $(date '+%Y-%m-%d %H:%M:%S UTC')"
          PAYLOAD=$(jq -n \
            --arg operation "createReportInAllSandboxes" \
            --arg reportTitle "$REPORT_TITLE" \
            '{operation: $operation, reportTitle: $reportTitle}')
          
          # Retry logic to handle ResourceNotReadyException and TooManyRequestsException
          # Note: AdminLambda has 15min timeout and may take time to process all sandboxes
          MAX_RETRIES=3
          RETRY_COUNT=0
          RETRY_DELAY=30
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES..."
          
            # Capture stderr and stdout
            if OUTPUT=$(aws lambda invoke \
              --function-name ${{ env.AWS_ENVIRONMENT }}AdminLambda \
              --payload "$PAYLOAD" \
              --cli-binary-format raw-in-base64-out \
              --cli-read-timeout 900 \
              response.json 2>&1); then
          
              # Check if response.json was created and is valid
              if [ -f response.json ]; then
                echo "Lambda response:"
                cat response.json | jq '.' || cat response.json
          
                # Check for Lambda function errors in the response
                if grep -q '"errorMessage"' response.json 2>/dev/null; then
                  echo "Lambda function returned an error, but invocation succeeded"
                  rm response.json
                  exit 1
                fi
          
                rm response.json
                echo "Successfully created pre-deployment report"
                exit 0
              fi
            fi
          
            # Invocation failed
            echo "Lambda invocation output: $OUTPUT"
            RETRY_COUNT=$((RETRY_COUNT + 1))
          
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              # Only retry on specific retryable errors
              if echo "$OUTPUT" | grep -qE "ResourceNotReadyException|TooManyRequestsException|Rate Exceeded|Throttling"; then
                echo "Retryable error detected. Waiting ${RETRY_DELAY}s before retry..."
                sleep $RETRY_DELAY
                RETRY_DELAY=$((RETRY_DELAY + 30))  # Linear backoff (30s, 60s, 90s)
              else
                echo "Non-retryable error encountered. Failing immediately."
                exit 1
              fi
            else
              echo "Max retries ($MAX_RETRIES) reached. Failed to create pre-deployment report."
              echo "This may indicate the Lambda needs more resources or the operation should be async."
              exit 1
            fi
          done

      - name: Deploy Conformance-Gateway Stack to ${{ env.AWS_ENVIRONMENT }}
        run: |
          cd cdk/
          cdk deploy ${{ env.AWS_ENVIRONMENT }}ConformanceStack --require-approval never

      - name: Verify a scenario in AWS Dev environment
        env:
          TEST_LOGIN_EMAIL: ${{ secrets.DEV_CONFORMANCE_USER_EMAIL }} # User account details to log in the Web UI.
          TEST_LOGIN_PASSWORD: ${{ secrets.DEV_CONFORMANCE_USER_PASSWORD }}
          TEST_BASE_URL: ${{ secrets.DEV_CONFORMANCE_WEB_URL }}
        run: |
          ./mvnw -B test -Pintegration
