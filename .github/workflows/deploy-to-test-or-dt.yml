name: Test Report Generation

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - dt

env:
  AWS_REGION: "eu-north-1"
  AWS_ENVIRONMENT: ${{ github.event.inputs.environment }}

jobs:
  test-report-generation:
    name: Test Report Generation
    runs-on: ubuntu-latest
    steps:
      - name: Set environment-specific secrets
        id: set-secrets
        run: |
          if [ "${{ env.AWS_ENVIRONMENT }}" = "dt" ]; then
            echo "AWS_ACCESS_KEY_ID=${{ secrets.DT_AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.DT_AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          else
            echo "AWS_ACCESS_KEY_ID=${{ secrets.TEST_AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.TEST_AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}

      - name: Warm up AdminLambda (prevent cold start)
        run: |
          echo "Warming up AdminLambda at $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Note: VPC-attached Lambdas can take 10-30 seconds on cold start"
          
          WARM_PAYLOAD='{"operation":"ping"}'
          
          aws lambda invoke \
            --function-name ${{ env.AWS_ENVIRONMENT }}AdminLambda \
            --invocation-type Event \
            --payload "$WARM_PAYLOAD" \
            --cli-binary-format raw-in-base64-out \
            /dev/null 2>&1 || echo "Warm-up invocation sent (async)"
          
          # Wait a bit for Lambda to initialize
          echo "Waiting 30 seconds for Lambda to warm up..."
          sleep 30
          echo "Lambda should now be warm"

      - name: Create pre-deployment reports in all sandboxes
        run: |
          echo "Creating report in all sandboxes before deployment at $(date '+%Y-%m-%d %H:%M:%S UTC')"
          REPORT_TITLE="Before DCSA deployment - $(date '+%Y-%m-%d %H:%M:%S UTC')"
          PAYLOAD=$(jq -n \
            --arg operation "createReportInAllSandboxes" \
            --arg reportTitle "$REPORT_TITLE" \
            '{operation: $operation, reportTitle: $reportTitle}')
          
          aws lambda invoke \
            --function-name ${{ env.AWS_ENVIRONMENT }}AdminLambda \
            --payload "$PAYLOAD" \
            --cli-binary-format raw-in-base64-out \
            --cli-read-timeout 550 \
            --cli-connect-timeout 60 \
            response.json
          
          echo "Successfully created pre-deployment reports"
          echo "Lambda response:"
          cat response.json | jq '.'
          rm response.json

