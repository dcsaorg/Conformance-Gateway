env:
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true
  contexts:
    - name: Conformance authenticated application
      urls:
        - ${APP_URL}
        - ${API_URL}/conformance/webui
      includePaths:
        - 'https://(?:dev\.conformance-development-1|dt\.conformance-dt-1|test\.conformance-test-1)\.dcsa\.org(?:/.*)?'
        - 'https://(?:dev-webui\.conformance-development-1|dt-webui\.conformance-dt-1|test-webui\.conformance-test-1)\.dcsa\.org(?:/.*)?'

jobs:
  # Angular requires inline styles unless the application and edge layer coordinate
  # per-response nonces. Scripts remain restricted to the application's own origin.
  - type: alertFilter
    alertFilters:
      - ruleId: '10055-6'
        ruleName: CSP style-src unsafe-inline
        newRisk: Info

  - type: passiveScan-config
    parameters:
      scanOnlyInScope: true

  # Use only read-only requests in this initial profile. A generic crawler can
  # interact with sandbox-management controls even when no active scan runs.
  - type: requestor
    requests:
      - name: Authenticated application root
        url: ${APP_URL}/
        method: GET
        responseCode: 200
      - name: Authenticated landing route
        url: ${APP_URL}/environment
        method: GET
        responseCode: 200
      - name: Read available standards from the authenticated API
        url: ${API_URL}/conformance/webui
        method: POST
        headers:
          - 'Content-Type: application/json'
          - 'Authorization: Bearer ${CONFORMANCE_ACCESS_TOKEN}'
        data: '{"operation":"getAvailableStandards"}'
        responseCode: 200
    tests:
      - name: Authenticated API request must return 200
        type: url
        url: ${API_URL}/conformance/webui
        operator: or
        responseHeaderRegex: '\Q200 OK\E'
        onFail: error

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk
      reportFile: zap-authenticated-report.html
      reportTitle: Conformance authenticated ZAP scan
      reportDescription: Passive scan of static routes and read-only API requests using an operator-supplied Auth0 access token; does not test browser sign-in.
    sites:
      - ${APP_URL}
      - ${API_URL}
    alwaysRun: true

  - type: exitStatus
    parameters:
      warnLevel: Medium
      errorLevel: High
      warnExitValue: 0
    alwaysRun: true
