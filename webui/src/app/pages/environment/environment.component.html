<div class="pageTitle">Sandboxes</div>

<div class="pageSubtitle">
    <button
        id="create_sandbox_button"
        mat-raised-button
        color="primary"
        title="Create sandbox"
        (click)="onCreateSandbox()"
        >Create sandbox</button>
</div>

@if (isLoading) {
  <app-text-waiting text="Retrieving existing sandboxes..."></app-text-waiting>
} @else {
  <mat-form-field class="fullWidth entityCard">
    <mat-label>Search sandboxes by name</mat-label>
    <input
      id="sandbox_search_input"
      matInput
      type="search"
      autocomplete="off"
      [ngModel]="searchTerm"
      (ngModelChange)="onSearchTermChange($event)"
    />
    <mat-icon matPrefix>search</mat-icon>
  </mat-form-field>
}

@for (sandbox of filteredSandboxes; track sandbox.id) {
  <mat-card
  [ngClass]="'entityCard withContentPadding withPointerCursor'"
  (click)="onSandboxClick(sandbox)">
    <div>
      <app-sandbox-type [sandbox]="sandbox"></app-sandbox-type>
    </div>
    <div class="wrappingText" style="color: grey">{{sandbox.name}}</div>
  </mat-card>
}

@if (!isLoading && searchTerm.trim() && filteredSandboxes.length === 0) {
  <div class="waiting" role="status">No sandboxes match “{{searchTerm.trim()}}”.</div>
}
